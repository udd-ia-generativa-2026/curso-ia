[project]
name = "curso-ia"
version = "0.1.0"
description = "Código común del curso Aplicaciones de IA Generativa"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pydantic-ai-slim[google,openai]>=2.55,<3",
  "python-dotenv>=1,<2",
  "pandas>=2.2,<4",
  "tqdm>=4.66,<5",
  "ipywidgets>=7.6,<9",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curso_ia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
