"""
expected = "El documento solo excluye las solicitudes posteriores al viaje; no confirma que se aplique antes ni sus requisitos."

[[cases]]
id = "dato-ausente"
input = """
Documento para el ejercicio — síntesis didáctica de una regla histórica descrita en el caso Air Canada de 2024:
