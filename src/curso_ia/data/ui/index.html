<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servicio del proyecto</title>
<style>
  :root {
    --bg: #EFEDE6; --ink: #293233; --teal: #39695F; --clay: #AB6249; --line: #d6d2c6;
    --card: #fbfaf6; --muted: #5d6667; --ok: #39695F; --warn: #9a6a12; --err: #a23b2a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { padding: 14px 22px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; }
  header .meta { color: var(--muted); font-size: 13px; }
  .layout { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 58px); }
  aside { border-right: 1px solid var(--line); padding: 16px; overflow-y: auto; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 8px; }
  aside h2:first-child { margin-top: 0; }
  select, textarea, input[type=text] { font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 7px 9px; width: 100%; }
  button { font: inherit; border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; background: var(--teal); color: #fff; }
  button.secondary { background: transparent; color: var(--teal); border: 1px solid var(--teal); }
  button.deny { background: var(--clay); }
  button:disabled { opacity: .45; cursor: default; }
  .tool { padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .tool code { font-size: 13px; font-weight: 600; }
  .tool p { margin: 3px 0 0; color: var(--muted); }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; margin-left: 4px; border: 1px solid currentColor; vertical-align: 1px; }
  .b-effect { color: var(--clay); } .b-cite { color: var(--teal); } .b-done { color: var(--ok); }
  .b-pending { color: var(--warn); } .b-error { color: var(--err); } .b-human { color: var(--clay); } .b-text { color: var(--muted); }
  main { display: flex; flex-direction: column; min-height: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 18px 26px; }
  .empty { color: var(--muted); margin-top: 40px; text-align: center; }
  .msg { max-width: 880px; margin: 0 auto 14px; }
  .user { background: var(--ink); color: #fff; padding: 9px 13px; border-radius: 10px 10px 2px 10px; margin-left: auto; width: fit-content; max-width: 80%; white-space: pre-wrap; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 15px; }
  .card .head { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .reply { white-space: pre-wrap; }
  .fields { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 4px 0; }
  .fields .k { color: var(--muted); font-size: 13px; padding-top: 1px; }
  .fields .v { white-space: pre-wrap; word-break: break-word; }
  .fields ul { margin: 0; padding-left: 18px; }
  .steps { margin: 10px 0 0; padding: 8px 10px; border-left: 3px solid var(--line); font-size: 13px; color: var(--muted); }
  .steps div { margin: 2px 0; word-break: break-word; }
  .steps .s-denied { color: var(--clay); } .steps .s-approval { color: var(--warn); } .steps .s-retry { color: var(--err); }
  .approval { margin-top: 10px; border: 1px solid var(--warn); border-radius: 8px; padding: 10px; background: #fff8ea; }
  .approval .call { margin-bottom: 8px; }
  .approval .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .approval input[type=text] { flex: 1; min-width: 180px; }
  .approval .chosen { font-size: 13px; font-weight: 600; }
  .error { color: var(--err); white-space: pre-wrap; }
  .foot { margin-top: 8px; font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .foot a { color: var(--teal); cursor: pointer; text-decoration: underline; }
  pre.raw { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-size: 12px; overflow-x: auto; max-height: 360px; }
  .composer { border-top: 1px solid var(--line); padding: 12px 26px; }
  .composer .inner { max-width: 880px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea { resize: vertical; min-height: 46px; max-height: 200px; }
  .hint { max-width: 880px; margin: 0 auto 6px; font-size: 12px; color: var(--muted); min-height: 16px; }
  .warn { color: var(--warn); font-size: 13px; margin-top: 8px; }
  .working { color: var(--muted); font-style: italic; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; height: auto; } aside { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1 id="project">Servicio del proyecto</h1>
  <span class="meta" id="meta">Cargando…</span>
</header>
<div class="layout">
  <aside>
    <h2>Ámbito</h2>
    <select id="scope"></select>
    <div class="warn" id="scope-note" hidden>El ámbito queda fijo durante la conversación; para cambiarlo, empiecen una nueva.</div>
    <div style="margin-top:12px"><button class="secondary" id="reset">Nueva conversación</button></div>
    <h2>Herramientas</h2>
    <div id="tools"></div>
    <h2>Descripción</h2>
    <div id="description" style="font-size:13px;color:var(--muted)"></div>
    <div class="warn" id="health-note" hidden></div>
  </aside>
  <main>
    <div id="chat"><div class="empty" id="empty">Escriban un pedido como lo haría una persona usuaria del sistema.</div></div>
    <div class="composer">
      <div class="hint" id="hint"></div>
      <div class="inner">
        <textarea id="goal" rows="2" placeholder="Pedido (Ctrl+Enter para enviar)"></textarea>
        <button id="send">Enviar</button>
      </div>
    </div>
  </main>
</div>
<script>
"use strict";
// Interfaz común del curso: usa solo el contrato (/schema, /health, /agent/run, /trace/{id}).
// Todo lo que viene del servicio se muestra con textContent, nunca como HTML.
const $ = (id) => document.getElementById(id);
const state = { last: null, busy: false, shownSteps: {} };

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") node.className = value; else if (key === "text") node.textContent = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value); else node.setAttribute(key, value);
  }
  for (const child of children) if (child != null) node.append(child);
  return node;
}

function short(value, limit = 220) {
  const text = typeof value === "string" ? value : JSON.stringify(value);
  return text.length > limit ? text.slice(0, limit - 1) + "…" : text;
}

function callArgs(args) {
  return Object.entries(args || {}).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", ");
}

async function api(method, path, body) {
  const response = await fetch(path, {
    method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await response.json(); } catch (error) { data = null; }
  if (!response.ok) {
    const detail = data && data.detail ? (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail)) : response.statusText;
    throw new Error(`HTTP ${response.status}: ${detail}`);
  }
  return data;
}

async function loadService() {
  try {
    const [schema, health] = await Promise.all([api("GET", "/schema"), api("GET", "/health")]);
    document.title = schema.project;
    $("project").textContent = schema.project;
    $("meta").textContent = `modelo ${schema.model} · modo ${schema.mode} · contrato ${schema.contract_version}` +
      (health.curso_ia ? ` · curso-ia ${health.curso_ia}` : "");
    $("description").textContent = schema.description || "Sin descripción.";
    for (const scope of schema.scopes) $("scope").append(el("option", { value: scope, text: scope }));
    for (const tool of schema.tools) {
      $("tools").append(el("div", { class: "tool" },
        el("code", { text: tool.name }),
        tool.effect ? el("span", { class: "badge b-effect", text: "efecto · aprobación" }) : null,
        tool.citations ? el("span", { class: "badge b-cite", text: "cita" }) : null,
        el("p", { text: short(tool.description || "", 160) })));
    }
    const notes = [];
    if (health.missing && health.missing.length) notes.push("Falta configurar: " + health.missing.join(", "));
    if (health.contract_problems && health.contract_problems.length) notes.push("Contrato: " + health.contract_problems.join(" "));
    if (notes.length) { $("health-note").hidden = false; $("health-note").textContent = notes.join("\n"); }
  } catch (error) {
    $("meta").textContent = "No se pudo leer el servicio: " + error.message;
  }
  updateComposer();
}

function updateComposer() {
  const last = state.last;
  const pending = last && last.status === "pending_approval";
  $("send").disabled = state.busy || pending;
  $("goal").disabled = state.busy || pending;
  $("scope").disabled = state.busy || (last && last.status === "done");
  $("scope-note").hidden = !(last && last.status === "done");
  $("reset").disabled = state.busy;
  let hint = "";
  if (state.busy) hint = "El servicio está trabajando…";
  else if (pending) hint = "Decidan las acciones pendientes antes de seguir.";
  else if (last && last.status === "done") hint = `Sigue la conversación (consulta complementaria de ${last.run_id}, ámbito ${last.scope}).`;
  else if (last && last.status === "error") hint = "La ejecución anterior terminó en error: el próximo pedido empieza una conversación nueva.";
  $("hint").textContent = hint;
}

function addMessage(node) {
  $("empty")?.remove();
  const wrapper = el("div", { class: "msg" }, node);
  $("chat").append(wrapper);
  $("chat").scrollTop = $("chat").scrollHeight;
  return wrapper;
}

function renderValue(value) {
  if (value === null || value === undefined) return el("span", { class: "b-text", text: "—" });
  if (Array.isArray(value)) {
    if (!value.length) return el("span", { class: "b-text", text: "(vacío)" });
    const list = el("ul");
    for (const item of value) list.append(el("li", {}, typeof item === "object" && item !== null
      ? el("span", { text: Object.entries(item).map(([k, v]) => `${k}: ${typeof v === "string" ? v : JSON.stringify(v)}`).join(" · ") })
      : el("span", { text: String(item) })));
    return list;
  }
  if (typeof value === "object") return el("span", { text: JSON.stringify(value, null, 1) });
  return el("span", { text: String(value) });
}

function renderOutput(body) {
  if (!body.output) return null;
  if (body.output_kind === "text") return el("div", { class: "reply", text: body.output.reply ?? JSON.stringify(body.output) });
  const grid = el("div", { class: "fields" });
  for (const [key, value] of Object.entries(body.output)) {
    grid.append(el("div", { class: "k", text: key }), el("div", { class: "v" }, renderValue(value)));
  }
  return grid;
}

function stepLine(step) {
  switch (step.kind) {
    case "tool": return ["", `Herramienta ${step.tool}(${callArgs(step.args)}) → ${short(step.result, 200)}`];
    case "tool_denied": return ["s-denied", `No se ejecutó ${step.tool}: la persona lo rechazó`];
    case "approval_requested": return ["s-approval", `Pide aprobación: ${step.tool}(${callArgs(step.args)})`];
    case "approval_decided": return [step.approved ? "" : "s-denied",
      step.approved ? `La persona aprobó ${step.tool}` : `La persona rechazó ${step.tool} (${step.reason || "sin motivo"})`];
    case "retry": return ["s-retry", `PydanticAI pidió corregir ${step.tool || "la salida"}: ${short(step.text, 200)}`];
    case "model": return null;
    default: return ["", step.kind];
  }
}

function statusBadge(body) {
  const names = { done: ["b-done", "terminada"], pending_approval: ["b-pending", "espera aprobación"], error: ["b-error", "error"] };
  const [cls, text] = names[body.status] || ["b-text", body.status];
  return el("span", { class: "badge " + cls, text });
}

function renderTurn(body, record) {
  const card = el("div", { class: "card" });
  card.append(el("div", { class: "head" }, document.createTextNode(`run ${body.run_id} · ámbito ${body.scope}`), statusBadge(body),
    body.needs_human ? el("span", { class: "badge b-human", text: "derivada a una persona" }) : null,
    body.output_kind === "text" ? el("span", { class: "badge b-text", text: "texto libre" }) : null));
  const output = renderOutput(body);
  if (output) card.append(output);
  if (body.error) card.append(el("div", { class: "error", text: body.error }));
  if (record) {
    // Después de una decisión la traza se arma de nuevo y la decisión queda junto al pedido de aprobación:
    // se muestran los pasos que no estaban, sin mirar su número.
    const shown = state.shownSteps[body.run_id] || new Set();
    const keyOf = (step) => JSON.stringify({ ...step, step: undefined });
    const fresh = record.steps.filter((step) => !shown.has(keyOf(step)));
    record.steps.forEach((step) => shown.add(keyOf(step)));
    state.shownSteps[body.run_id] = shown;
    const lines = fresh.map(stepLine).filter(Boolean);
    if (lines.length) {
      const box = el("div", { class: "steps" });
      for (const [cls, text] of lines) box.append(el("div", { class: cls, text: "· " + text }));
      card.append(box);
    }
  }
  if (body.status === "pending_approval") card.append(renderApproval(body));
  const foot = el("div", { class: "foot" });
  if (record) {
    const parts = [`${record.requests} solicitudes`, `${record.input_tokens} tokens de entrada`, `${record.output_tokens} de salida`];
    if (record.latency_ms != null) parts.push(`${(record.latency_ms / 1000).toFixed(1)} s`);
    if (record.estimated_cost_usd != null) parts.push(`USD ${Number(record.estimated_cost_usd).toFixed(5)}`);
    foot.append(el("span", { text: parts.join(" · ") }));
    const raw = el("pre", { class: "raw", text: JSON.stringify(record, null, 2) });
    raw.hidden = true;
    foot.append(el("a", { text: "Ver traza", onclick: () => { raw.hidden = !raw.hidden; } }));
    card.append(foot, raw);
  }
  return card;
}

function renderApproval(body) {
  const box = el("div", { class: "approval" });
  box.append(el("div", { style: "font-weight:600;margin-bottom:6px", text: "La acción necesita la aprobación de una persona" }));
  const decisions = {};
  const submit = el("button", { text: "Enviar decisiones", disabled: "" });
  const refresh = () => { submit.disabled = Object.keys(decisions).length !== body.pending.length; };
  for (const call of body.pending) {
    const chosen = el("span", { class: "chosen" });
    const reason = el("input", { type: "text", placeholder: "Motivo (obligatorio al rechazar)" });
    const approve = el("button", { text: "Aprobar", onclick: () => { decisions[call.tool_call_id] = { approve: true }; chosen.textContent = "✓ aprobada"; refresh(); } });
    const deny = el("button", { class: "deny", text: "Rechazar", onclick: () => {
      if (!reason.value.trim()) { reason.focus(); reason.placeholder = "Escriban el motivo del rechazo"; return; }
      decisions[call.tool_call_id] = { approve: false, reason: reason.value.trim() }; chosen.textContent = "✗ rechazada"; refresh();
    } });
    box.append(el("div", { class: "call" },
      el("div", {}, el("code", { text: call.tool }), document.createTextNode(`(${callArgs(call.args)})`)),
      el("div", { class: "row" }, approve, deny, reason, chosen)));
  }
  submit.addEventListener("click", async () => {
    box.querySelectorAll("button, input").forEach((node) => { node.disabled = true; });
    const summary = body.pending.map((call) => {
      const decision = decisions[call.tool_call_id];
      return decision.approve ? `Apruebo ${call.tool}` : `Rechazo ${call.tool}: ${decision.reason}`;
    }).join("\n");
    await runTurn({ run_id: body.run_id, decisions }, summary);
  });
  box.append(el("div", { class: "row" }, submit));
  return box;
}

async function runTurn(request, label) {
  state.busy = true; updateComposer();
  addMessage(el("div", { class: "user", text: label }));
  const waiting = addMessage(el("div", { class: "working", text: "El servicio está trabajando…" }));
  try {
    const body = await api("POST", "/agent/run", request);
    let record = null;
    try { record = await api("GET", body.trace_url); } catch (error) { record = null; }
    waiting.replaceChildren(renderTurn(body, record));
    state.last = body;
  } catch (error) {
    waiting.replaceChildren(el("div", { class: "card" }, el("div", { class: "error", text: error.message })));
  } finally {
    state.busy = false; updateComposer();
    $("chat").scrollTop = $("chat").scrollHeight;
  }
}

async function send() {
  const goal = $("goal").value.trim();
  if (!goal || state.busy) return;
  $("goal").value = "";
  const last = state.last;
  const request = last && last.status === "done" ? { run_id: last.run_id, goal } : { goal, scope: $("scope").value };
  if (last && last.status === "error") state.last = null;
  await runTurn(request, goal);
}

$("send").addEventListener("click", send);
$("goal").addEventListener("keydown", (event) => { if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) send(); });
$("reset").addEventListener("click", () => {
  state.last = null; state.shownSteps = {};
  $("chat").replaceChildren(el("div", { class: "empty", id: "empty", text: "Conversación nueva. Elijan el ámbito y escriban un pedido." }));
  updateComposer();
});
loadService();
</script>
</body>
</html>
